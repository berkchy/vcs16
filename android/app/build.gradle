import java.time.LocalDateTime
import java.time.Month
import java.time.temporal.ChronoUnit

apply plugin: "com.android.application"

android {
	namespace = "su.xash.cs16client"
	ndkVersion = "28.2.13676358"
	compileSdk = 36

	defaultConfig {
		applicationId = "su.xash.cs16client"
		versionName = "1.35-" + getGitHash()
		versionCode = getBuildNum()
		// The native libraries are built against API 24 (see the nexora native
		// build), and cl_dll's crash handler needs process_vm_readv, which
		// bionic only declares from API 23 on. Building the app against 21 left
		// crashhandler.cpp without that declaration and the client never
		// compiled, so match the level the rest of the stack already needs.
		minSdk = 24
		targetSdk = 36
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_11
		targetCompatibility = JavaVersion.VERSION_11
	}

	externalNativeBuild {
		cmake {
			version = "3.22.1"
			path file("../../CMakeLists.txt")
		}
	}

	defaultConfig {
		externalNativeBuild {
			cmake {
				// Ccache for both compilers.
				arguments "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"

				// The NDK sysroot ships no fontconfig, so mainui_cpp's
				// pkg_check_modules(FC REQUIRED fontconfig) fails the app build
				// at configure time. Apple already forces the stb renderer for
				// the same reason. Kept in defaultConfig because the CI job
				// assembles the debug variant, which has no build type of its
				// own to hang these on. This does not affect the nexora native
				// build, which finds fontconfig on its own runner.
				arguments "-DMAINUI_USE_STB=ON"
			}
		}
	}

	lint {
		abortOnError = false
	}

	packaging {
		jniLibs {
			keepDebugSymbols.add("**/*.so")
			useLegacyPackaging = true
		}
	}

	signingConfigs {
		debug {}

		continuous {
			if (System.getenv('KEYSTORE_FILE_PATH') != null) {
				storeFile = file(System.getenv('KEYSTORE_FILE_PATH'))
				storePassword = System.getenv('KEYSTORE_PASSWORD')
				keyAlias = System.getenv('KEY_ALIAS')
				keyPassword = System.getenv('KEY_PASSWORD')
			}
		}
	}

	buildTypes {
		debug {
			debuggable = true
			applicationIdSuffix = ".test"

			proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.txt"
		}

		release {
			minifyEnabled = true
			shrinkResources = true

			proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.txt"
		}

		create("continuous") {
			initWith(getByName("release"))
			applicationIdSuffix = ".test"
			signingConfig = signingConfigs.continuous
		}
	}

	flavorDimensions += "version"

	productFlavors {
		create("googlePlay") {
			dimension = "version"
			applicationId = "in.celest.xash3d.cs16client"
			buildConfigField("Boolean", "IS_GOOGLE_PLAY_BUILD", "true")
		}

		create("git") {
			dimension = "version"
			buildConfigField("Boolean", "IS_GOOGLE_PLAY_BUILD", "false")

			// Without an abiFilters block AGP builds every ABI the NDK
			// supports, so the APK carried lib/x86 and lib/x86_64 copies of
			// the client that nothing can load. The engine APK still ships
			// xash for x86, but nexora only ever produced the arm64-v8a and
			// armeabi-v7a bundles, so an x86 install never got a cl_dll from
			// anywhere: those two ABIs were dead weight in the APK. The
			// googlePlay flavor keeps the full set - it is distributed
			// through the store, where x86 emulators are a real target.
			ndk {
				abiFilters "arm64-v8a", "armeabi-v7a"
			}

			packaging {
				jniLibs {
					// useLegacyPackaging stores .so uncompressed, which is what
					// main() keeps - the engine loads xashmenu straight out of
					// the APK, so extractNativeLibs=false has to stay. But with
					// the client library gone the menu is the only lib left, and
					// deflating it takes it from 5.3 MB to 1.9 MB, which is
					// what keeps the shell near 2 MB instead of 5.
					useLegacyPackaging = true
				}
			}

			externalNativeBuild {
				cmake {
					// The client library is the biggest thing in the APK and
					// nexora injects its own build of it into the client
					// package after download (see the patch log's
					// "+ libclient_android_arm64.so"), so a second copy here
					// was never loaded. Dropping it takes the APK from tens of
					// MB to ~2 MB. The menu stays: the engine's vgui2 loader
					// finds libxashmenu in the *client* package's lib/, and
					// nexora does not ship one - the patch log lists it with
					// no "+", i.e. already present in the APK.
					arguments "-DBUILD_CLIENT=OFF"
				}
			}
		}
	}

	buildFeatures {
		buildConfig = true
	}

	// The engine resolves the mod assets from the *client* package, so the
	// client APK has to carry them. The tree is the vanilla client's own assets
	// directory (3rdparty/cs16client-assets, taken from CS16Client-Android.apk):
	// the same files in the same folders. Everything that was assembled from
	// other pieces - the extras fork plus the yapb configs - did not match what
	// the menu and the bot data loader look for, and the menu entries came out
	// greyed out.
	//
	// googlePlay only: that flavor is distributed standalone, so it has to
	// carry the game content itself. The git flavor is the one nexora ships,
	// and nexora delivers the content as its own bundle instead - see
	// sourceSets below, which drops assets/ for git entirely.
	sourceSets {
		getByName("main") {
			assets.srcDirs += file("../../3rdparty/cs16client-assets")
		}
		getByName("git") {
			// nexora installs sound/maps/gfx/touch/addons into the game
			// directory from its own release assets, so shipping a second
			// copy inside the APK only doubled the download.
			assets.srcDirs = []
		}
	}
}


// The engine reads the mod assets from the *client* package: XashActivity
// resolves them with getResourcesForApplication(getCallingPackage()), so the
// client APK - not the engine APK - has to ship the extras, the yapb configs
// and the bot graphs that CMake stages into src/main/assets.
// CMake stages them while configuring, but nothing ordered Gradle's asset merge
// after externalNativeBuild, and the APK was going out with an empty assets/
// (no touch.cfg, no yapb cfg, no bot graphs), which the engine needs to start.
// Depending on the configure step is enough and costs nothing.
tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
	dependsOn(tasks.matching { it.name.startsWith("configureCMake") })
}

static def getBuildNum() {
	LocalDateTime now = LocalDateTime.now()
	LocalDateTime releaseDate = LocalDateTime.of(2015, Month.OCTOBER, 29, 0, 0, 0)
	int qBuildNum = releaseDate.until(now, ChronoUnit.DAYS)
	int minuteOfDay = now.getHour() * 60 + now.getMinute()
	return qBuildNum * 10000 + minuteOfDay
}

def getGitHash() {
	Process process = new ProcessBuilder("git", "rev-parse", "--short", "HEAD")
			.directory(project.rootDir)
			.redirectErrorStream(true)
			.start()
	InputStreamReader inputStreamReader = new InputStreamReader(process.getInputStream())
	BufferedReader bufferedReader = new BufferedReader(inputStreamReader)

	return bufferedReader.getText().trim()
}