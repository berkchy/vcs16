# The daemon runs on the JDK the CI already installs (setup-java, Temurin 21).
# This file used to pin a JetBrains daemon JVM and a foojay download URL, so
# every Android build depended on that endpoint being reachable - "Unable to
# download toolchain matching the requirements" red the job for reasons that had
# nothing to do with the code. Leaving it out lets the local JDK be used.
toolchainVersion=21
